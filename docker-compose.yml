services:
  birrcare-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: birrcare_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/birrcare.db
      - APP_ENV=production
      # Values below come from .env (see .env.example)
      - APP_TIMEZONE=${APP_TIMEZONE:-UTC}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - CF_ACCESS_TRUST_EMAIL_HEADER=${CF_ACCESS_TRUST_EMAIL_HEADER:-false}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - AUTH_DEV_FALLBACK=${AUTH_DEV_FALLBACK:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - SUPER_ADMIN_USER=${SUPER_ADMIN_USER:-admin}
      - SUPER_ADMIN_PIN=${SUPER_ADMIN_PIN:-1234}
    volumes:
      - ./data:/data

  birrcare-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: birrcare_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - INTERNAL_BACKEND_URL=http://birrcare-backend:8080
      - NEXT_PUBLIC_API_URL=/api/v1
      - NODE_ENV=production
    depends_on:
      - birrcare-backend

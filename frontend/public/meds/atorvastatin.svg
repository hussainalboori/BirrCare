<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="lipiBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0f9ff" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </radialGradient>
    <!-- Tablet 3D Oval Pearl Surface -->
    <radialGradient id="lipiPill" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <filter id="shadowLipi" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0369a1" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.12" />
    </filter>
    <linearGradient id="bevelLipi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.7" />
    </linearGradient>
  </defs>

  <!-- Container background -->
  <rect width="200" height="200" rx="36" fill="url(#lipiBg)" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#bae6fd" stroke-width="2" stroke-dasharray="4 4" opacity="0.7" />

  <!-- Drop Shadow & Oval Tablet Pill Body -->
  <g filter="url(#shadowLipi)">
    <!-- Outer Oval Bevel Rim -->
    <ellipse cx="100" cy="100" rx="68" ry="42" fill="url(#bevelLipi)" />
    <!-- Inner Oval Pill Face -->
    <ellipse cx="100" cy="100" rx="62" ry="37" fill="url(#lipiPill)" />
    <!-- Glossy Highlight Curve -->
    <path d="M 52 88 C 70 72 130 72 148 88 C 130 80 70 80 52 88 Z" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Debossed Text "40" -->
  <text x="100.5" y="108.5" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#ffffff" letter-spacing="1">40</text>
  <text x="100" y="107" font-family="system-ui, -apple-system, sans-serif" font-size="26" font-weight="900" text-anchor="middle" fill="#475569" letter-spacing="1">40</text>

  <!-- Label Badge -->
  <g transform="translate(100, 172)">
    <rect x="-44" y="-12" width="88" height="20" rx="10" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="2" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#0369a1">LIPITOR 40mg</text>
  </g>
</svg>

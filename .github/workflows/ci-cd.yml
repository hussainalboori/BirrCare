name: Birrcare CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # -------------------------------------------------------------
  # Job 1: Backend CI (Go from go.mod, Tests, Vet, Static Build)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend CI (Go Test & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Verify Go dependencies
        run: go mod verify

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Backend Unit Tests
        run: go test -v -race ./...

      - name: Verify Static Binary Compilation (Zero CGO)
        run: CGO_ENABLED=0 GOOS=linux go build -ldflags="-w -s" -o /dev/null ./main.go

  # -------------------------------------------------------------
  # Job 2: Frontend CI (Next.js 16, TypeScript, Lint, Turbopack)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Next.js & ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

  # -------------------------------------------------------------
  # Job 3: Docker Build Verification (Layer Caching & Composition)
  # -------------------------------------------------------------
  docker-verify:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [backend-ci, frontend-ci]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config

      - name: Build Backend Container
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: birrcare-backend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend Container
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: birrcare-frontend:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 4: Publish images to GHCR (Main branch only)
  # -------------------------------------------------------------
  publish-and-deploy:
    name: Publish to GHCR
    runs-on: ubuntu-latest
    needs: [docker-verify]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Backend Container Metadata & Push
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/birrcare-backend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend Container Metadata & Push
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/birrcare-frontend
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deployment is pull-based: the BirrCare host polls main and deploys commits whose
  # run of this workflow succeeded (scripts/auto-deploy.sh + scripts/systemd/).
  # Never add a `runs-on: self-hosted` job here: on a public repo, fork pull
  # requests can run their own copy of this file on any registered runner.

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="aspirinBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffdf0" />
      <stop offset="100%" stop-color="#fef3c7" />
    </radialGradient>
    <!-- Tablet 3D Lighting -->
    <radialGradient id="aspirinPill" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="45%" stop-color="#fde047" />
      <stop offset="85%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#78350f" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="bevel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a16207" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Circular container background -->
  <rect width="200" height="200" rx="36" fill="url(#aspirinBg)" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#fde68a" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Drop Shadow & Main Pill Body -->
  <g filter="url(#shadow)">
    <!-- Outer Beveled Edge -->
    <circle cx="100" cy="100" r="62" fill="url(#bevel)" />
    <!-- Inner Pill Face -->
    <circle cx="100" cy="100" r="56" fill="url(#aspirinPill)" />
    <!-- Glossy Highlight Arch -->
    <path d="M 60 70 A 50 50 0 0 1 140 70 A 52 46 0 0 0 60 70 Z" fill="#ffffff" opacity="0.45" />
  </g>

  <!-- Debossed Text "ASP 100" -->
  <!-- Deboss highlight (bottom-right light bounce) -->
  <text x="100.5" y="94.5" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#fef08a" letter-spacing="1.5">ASP</text>
  <!-- Deboss shadow (top-left inner shadow) -->
  <text x="100" y="94" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" text-anchor="middle" fill="#854d0e" letter-spacing="1.5">ASP</text>

  <!-- Score line -->
  <line x1="68" y1="102" x2="132" y2="102" stroke="#a16207" stroke-width="2.5" stroke-linecap="round" />
  <line x1="68" y1="103" x2="132" y2="103" stroke="#fef08a" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Dose Text "100" -->
  <text x="100.5" y="122.5" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#fef08a" letter-spacing="1">100</text>
  <text x="100" y="122" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="800" text-anchor="middle" fill="#854d0e" letter-spacing="1">100</text>

  <!-- Label Badge -->
  <g transform="translate(100, 172)">
    <rect x="-42" y="-12" width="84" height="20" rx="10" fill="#fef08a" stroke="#eab308" stroke-width="1" />
    <text x="0" y="2" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#713f12">ASPIRIN 100</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Background subtle gradient -->
    <radialGradient id="amloBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </radialGradient>
    <!-- Tablet 3D White/Pearl Surface -->
    <radialGradient id="amloPill" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="55%" stop-color="#f8fafc" />
      <stop offset="85%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </radialGradient>
    <filter id="shadowAmlo" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#334155" flood-opacity="0.22" />
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.1" />
    </filter>
    <linearGradient id="bevelAmlo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.6" />
    </linearGradient>
  </defs>

  <!-- Container background -->
  <rect width="200" height="200" rx="36" fill="url(#amloBg)" />
  <circle cx="100" cy="100" r="82" fill="none" stroke="#e2e8f0" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />

  <!-- Drop Shadow & Main Pill Body (Octagonal Tablet) -->
  <g filter="url(#shadowAmlo)">
    <!-- Outer Octagon Bevel -->
    <polygon points="76,40 124,40 160,76 160,124 124,160 76,160 40,124 40,76" fill="url(#bevelAmlo)" />
    <!-- Inner Octagon Face -->
    <polygon points="78,46 122,46 154,78 154,122 122,154 78,154 46,122 46,78" fill="url(#amloPill)" />
    <!-- Glossy Highlight -->
    <path d="M 60 72 L 100 50 L 140 72 Q 100 80 60 72 Z" fill="#ffffff" opacity="0.6" />
  </g>

  <!-- Score Line dividing tablet -->
  <line x1="58" y1="100" x2="142" y2="100" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" />
  <line x1="58" y1="101.5" x2="142" y2="101.5" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

  <!-- Top Debossed "AML" -->
  <text x="100" y="85" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#ffffff" letter-spacing="1">AML</text>
  <text x="100" y="84" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" fill="#64748b" letter-spacing="1">AML</text>

  <!-- Bottom Debossed "5" -->
  <text x="100" y="128" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#ffffff">5</text>
  <text x="100" y="127" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" text-anchor="middle" fill="#64748b">5</text>

  <!-- Label Badge -->
  <g transform="translate(100, 172)">
    <rect x="-42" y="-12" width="84" height="20" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
    <text x="0" y="2" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" text-anchor="middle" fill="#334155">AMLODIPINE 5</text>
  </g>
</svg>

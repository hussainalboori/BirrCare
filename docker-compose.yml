services:
  birrcare-backend:
    # Named, so deploy.sh can keep the previous image and roll back to it.
    image: birrcare-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Set by scripts/deploy.sh; shown by /api/v1/health (issue #43).
        - GIT_SHA=${GIT_SHA:-dev}
    container_name: birrcare_backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/data/birrcare.db
      - APP_ENV=production
      # Values below come from .env (see .env.example)
      - APP_TIMEZONE=${APP_TIMEZONE:-}
      - CF_ACCESS_TEAM_DOMAIN=${CF_ACCESS_TEAM_DOMAIN:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - CF_ACCESS_TRUST_EMAIL_HEADER=${CF_ACCESS_TRUST_EMAIL_HEADER:-false}
      - SESSION_SECRET=${SESSION_SECRET:-}
      - AUTH_DEV_FALLBACK=${AUTH_DEV_FALLBACK:-false}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - SUPER_ADMIN_USER=${SUPER_ADMIN_USER:-admin}
      - SUPER_ADMIN_PIN=${SUPER_ADMIN_PIN:-1234}
      - EMERGENCY_NUMBER=${EMERGENCY_NUMBER:-}
      - DOCTOR_NAME=${DOCTOR_NAME:-}
      - DOCTOR_PHONE=${DOCTOR_PHONE:-}
      - DISABLE_2FA_FOR=${DISABLE_2FA_FOR:-}
      - PUSH_CONTACT=${PUSH_CONTACT:-}
      # One-tap switching from the home internet address (issue #29)
      - TRUSTED_HOME_IP=${TRUSTED_HOME_IP:-}
      - TRUSTED_HOME_SUBNETS=${TRUSTED_HOME_SUBNETS:-}
    volumes:
      - ./data:/data

  birrcare-frontend:
    image: birrcare-frontend:local
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - GIT_SHA=${GIT_SHA:-dev}
    container_name: birrcare_frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - INTERNAL_BACKEND_URL=http://birrcare-backend:8080
      - NEXT_PUBLIC_API_URL=/api/v1
      - NODE_ENV=production
      # Sent in every page as the offline fallback for the crisis call button.
      - EMERGENCY_NUMBER=${EMERGENCY_NUMBER:-}
    depends_on:
      - birrcare-backend
